services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: halfspace
      POSTGRES_PASSWORD: halfspace
      POSTGRES_DB: halfspace
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halfspace -d halfspace"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
